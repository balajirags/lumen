plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    // Shadow plugin for building a fat JAR
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    // JavaParser with symbol resolution
    implementation libs.javaparser.core

    // CLI framework
    implementation libs.picocli

    // Neo4j Java driver
    implementation libs.neo4j.driver

    // KuzuDB embedded graph database
    implementation libs.kuzu

    // Logging
    implementation libs.slf4j.simple

    // YAML config support
    implementation libs.snakeyaml

    // JSON parsing for external parser output
    implementation libs.gson

    // Kotlin compiler for parsing Kotlin source code
    implementation libs.kotlin.compiler
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'code.graph.App'
}

shadowJar {
    archiveBaseName = 'code-mem-graph'
    archiveClassifier = ''
    archiveVersion = ''
    mergeServiceFiles()
}

tasks.named('run') {
    // Use the root project dir as working directory so application.yaml is found
    workingDir = rootProject.projectDir
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
