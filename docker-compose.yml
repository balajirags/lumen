# lumen — docker-compose services
#
# Each service is behind a profile so nothing starts unless explicitly requested.
#
# Usage:
#
#   Run pipeline (Anthropic):
#     REPO_PATH=/path/to/repo docker compose --profile pipeline run --rm pipeline \
#       run /repo --output-dir /workspace/output
#
#   Run pipeline (Ollama, local):
#     REPO_PATH=/path/to/repo docker compose --profile pipeline run --rm pipeline \
#       run /repo --provider ollama --model qwen2.5:32b \
#       --base-url http://host.docker.internal:11434/v1
#
#   Serve generated doc-site:
#     docker compose --profile docs up docs
#     → http://localhost:8081
#
#   Start graph UI:
#     docker compose --profile ui up ui
#     → http://localhost:3002  (connect to /data/<run>/index.kuzu/db)
#
#   Run MCP HTTP pipeline:
#     REPO_PATH=/path/to/repo OUTPUT_PATH=./output MCP_PORT=8765 \
#       docker compose --profile mcp run --service-ports --rm mcp-http
#     → http://localhost:8765/mcp
#
# Environment variables:
#   ANTHROPIC_API_KEY   Optional; used for Anthropic provider
#   OPENAI_API_KEY      Optional; used for OpenAI provider
#   REPO_PATH           Path to the source repo to analyse (pipeline only)
#   OUTPUT_PATH         Where output is written/read (default: ./output)
#   DOCKER_IMAGE        Reusable lumen image tag (default: lumen)
#   MCP_PORT            Host/container port for HTTP MCP server (default: 8765)
#   DOCS_PORT           Host port for docs server (default: 8081)

services:

  pipeline:
    image: ${DOCKER_IMAGE:-lumen}
    volumes:
      - ${REPO_PATH:-/tmp}:/repo
      - ${OUTPUT_PATH:-./output}:/workspace/output
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # host.docker.internal lets the container reach the host machine.
    # On Mac/Windows (Docker Desktop) this is automatic; on Linux it needs
    # the extra_hosts entry below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [pipeline]

  mcp-http:
    image: ${DOCKER_IMAGE:-lumen}
    entrypoint:
      - /opt/lumen/scripts/run-mcp-http.sh
    volumes:
      - ${OUTPUT_PATH:-./output}:/workspace/output
      - ${REPO_PATH:-/tmp}:${REPO_PATH:-/tmp}
      - ${DB_PATH:-/tmp}:${DB_PATH:-/tmp}
    ports:
      - "${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REPO_PATH=${REPO_PATH:-}
      - REPO_NAME=${REPO_NAME:-}
      - DB_PATH=${DB_PATH:-}
      - MCP_PORT=${MCP_PORT:-8765}
      - MCP_HOST=0.0.0.0
      - MCP_PATH=/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [mcp]

  docs:
    image: ${DOCKER_IMAGE:-lumen}
    entrypoint:
      - /opt/lumen/scripts/run-docs-server.sh
    ports:
      - "${DOCS_PORT:-8081}:8080"
    environment:
      - OUTPUT_DIR=/workspace/output
      - SITE_DIR=/workspace/output/doc-site
      - SITE_TITLE=lumen Docs
      - DOCS_PORT=8080
    volumes:
      - ${OUTPUT_PATH:-./output}:/workspace/output
    profiles: [docs]

  ui:
    image: ${DOCKER_UI_IMAGE:-lumen-ui}
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "3002:3002"
    volumes:
      - ${OUTPUT_PATH:-./output}:/data
    environment:
      - NODE_ENV=production
    profiles: [ui]
