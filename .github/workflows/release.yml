name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(grep '^version = "' pipeline/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Git tag version:      $TAG_VERSION"
          echo "pyproject.toml version: $PY_VERSION"
          if [[ "$TAG_VERSION" != "$PY_VERSION" ]]; then
            echo "::error::Version mismatch! Tag $GITHUB_REF_NAME does not match pyproject.toml version $PY_VERSION"
            echo "Run: make release VERSION=$TAG_VERSION"
            exit 1
          fi
          echo "✓ Versions match"

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            arch: arm64
          - os: macos-13          # Intel Mac
            arch: amd64
          - os: ubuntu-latest     # Linux x86_64
            arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev

      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Build native tarball
        run: bash scripts/build-native.sh --version "${{ github.ref_name }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            releases/*.tar.gz
            releases/*.sha256

  # Optional: Linux arm64 via QEMU (slower, may be removed if too slow)
  build-linux-arm64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in arm64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            eclipse-temurin:21-jdk-jammy \
            bash -c '
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq curl python3 python3-venv nodejs npm graphviz libgraphviz-dev > /dev/null
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv python install 3.11
              ln -sf "$(uv python find 3.11)" /usr/local/bin/python3
              bash scripts/build-native.sh --version "${{ github.ref_name }}"
            '

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            releases/*.tar.gz
            releases/*.sha256

  build-docker:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-build the fat JAR natively on the amd64 runner to avoid Java TLS
      # failures when ./gradlew runs inside QEMU-emulated arm64 during Docker build.
      # The JAR is included in the build context via .dockerignore negation rule,
      # and the Dockerfile skips Gradle when the JAR is already present.
      - name: Set up Java 21 (for pre-building JAR)
        if: matrix.arch == 'arm64'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pre-build JAR natively (arm64 only)
        if: matrix.arch == 'arm64'
        run: cd indexer && ./gradlew shadowJar --no-daemon -q

      - name: Build Docker release tarball
        run: ARCH=${{ matrix.arch }} bash scripts/lumen-docker-release.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload Docker release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-docker-linux-${{ matrix.arch }}
          path: |
            releases/*.tar.gz
            releases/*.sha256

  publish:
    needs: [validate-version, build, build-linux-arm64, build-docker]
    if: always() && needs.build.result == 'success' && needs.build-docker.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate CHECKSUMS.txt
        run: |
          cd artifacts
          cat *.sha256 > CHECKSUMS.txt
          echo "=== CHECKSUMS.txt ==="
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/CHECKSUMS.txt
