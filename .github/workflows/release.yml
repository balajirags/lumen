name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(grep '^version = "' pipeline/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Git tag version:      $TAG_VERSION"
          echo "pyproject.toml version: $PY_VERSION"
          if [[ "$TAG_VERSION" != "$PY_VERSION" ]]; then
            echo "::error::Version mismatch! Tag $GITHUB_REF_NAME does not match pyproject.toml version $PY_VERSION"
            echo "Run: make release VERSION=$TAG_VERSION"
            exit 1
          fi
          echo "✓ Versions match"

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon — native bundle
            arch: arm64
            name: darwin-arm64
          - os: ubuntu-latest     # Linux x86_64 — native bundle
            arch: amd64
            name: linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev

      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Build native tarball
        run: bash scripts/build-native.sh --version "${{ github.ref_name }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-native-${{ matrix.name }}
          path: |
            releases/*.tar.gz
            releases/*.sha256

  build-docker:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-build the fat JAR natively on the amd64 runner to avoid Java TLS
      # failures when ./gradlew runs inside QEMU-emulated arm64 during Docker build.
      # The JAR is included in the build context via .dockerignore negation rule,
      # and the Dockerfile skips Gradle when the JAR is already present.
      - name: Set up Java 21 (for pre-building JAR)
        if: matrix.arch == 'arm64'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pre-build JAR natively (arm64 only)
        if: matrix.arch == 'arm64'
        run: cd indexer && ./gradlew shadowJar --no-daemon -q

      - name: Build Docker release tarball
        run: ARCH=${{ matrix.arch }} bash scripts/lumen-docker-release.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload Docker release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-docker-linux-${{ matrix.arch }}
          path: |
            releases/*.tar.gz
            releases/*.sha256

  publish:
    needs: [validate-version, build, build-docker]
    if: always() && needs.build.result == 'success' && needs.build-docker.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "lumen-*"
          merge-multiple: true

      - name: Generate CHECKSUMS.txt
        run: |
          cd artifacts
          cat *.sha256 > CHECKSUMS.txt
          echo "=== CHECKSUMS.txt ==="
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Artifacts

            | Artifact | Chip | OS | Type |
            |---|---|---|---|
            | [lumen-${{ github.ref_name }}-darwin-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lumen-${{ github.ref_name }}-darwin-arm64.tar.gz) | Apple Silicon (M1/M2/M3/M4) | macOS | Native |
            | [lumen-${{ github.ref_name }}-linux-amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lumen-${{ github.ref_name }}-linux-amd64.tar.gz) | Intel / AMD x86_64 | Linux | Native |
            | [lumen-docker-${{ github.ref_name }}-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lumen-docker-${{ github.ref_name }}-arm64.tar.gz) | Apple Silicon (M1/M2/M3/M4) | macOS · Linux arm64 | Docker |
            | [lumen-docker-${{ github.ref_name }}-amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lumen-docker-${{ github.ref_name }}-amd64.tar.gz) | Intel / AMD x86_64 | macOS (Intel) · Linux amd64 | Docker |

            ---

            ## Docker bundle — quick start

            ```bash
            # 1. Untar
            tar -xzf lumen-docker-${{ github.ref_name }}-<arch>.tar.gz
            cd lumen-docker-${{ github.ref_name }}-<arch>/runtime

            # 2. Load image (produces lumen:${{ github.ref_name }} + lumen:latest)
            ./scripts/lumen-docker-load.sh ../images/lumen-${{ github.ref_name }}-<arch>.tar

            # 3. Run full pipeline
            export ANTHROPIC_API_KEY=...
            make lumen-docker-run REPO=/path/to/repo \
              ARGS='--provider anthropic --model claude-sonnet-4-6'

            # 3b. Or use a local Ollama model
            make lumen-docker-run REPO=/path/to/repo \
              ARGS="--provider ollama --model qwen2.5:32b --base-url http://host.docker.internal:11434/v1"

            # MCP mode
            make lumen-docker-mcp REPO=/path/to/repo   # → http://127.0.0.1:8765/mcp
            ```

            > Replace `<arch>` with `arm64` (Apple Silicon / Linux ARM) or `amd64` (Intel/AMD).

            ---

            ## Native bundle — quick start

            > Requires only `graphviz` — no Docker, no Java, no Node, no Python.
            > Install: `brew install graphviz` (macOS) or `sudo apt install graphviz` (Linux)

            ```bash
            # 1. Untar
            tar -xzf lumen-${{ github.ref_name }}-<os>-<arch>.tar.gz
            cd lumen-${{ github.ref_name }}-<os>-<arch>

            # 2. (Optional) verify bundle integrity
            ./verify.sh

            # 3. Install — symlinks lumen into ~/.local/bin
            ./install.sh

            # 4. Run
            lumen run /path/to/repo --provider anthropic --model claude-sonnet-4-6
            lumen mcp /path/to/repo   # MCP mode → http://127.0.0.1:8765/mcp
            ```

            > Replace `<os>-<arch>` with `darwin-arm64` (Apple Silicon) or `linux-amd64` (Linux x86_64).
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/CHECKSUMS.txt
